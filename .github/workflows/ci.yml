name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'LTJ-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        run: ./mvnw -B test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore

  postgres-integration:
    name: postgres-integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smart_heritage_ci
          POSTGRES_USER: ci_placeholder
          POSTGRES_PASSWORD: ci_placeholder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_placeholder -d smart_heritage_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run PostgreSQL integration tests
        env:
          POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/smart_heritage_ci
          POSTGRES_TEST_USERNAME: ci_placeholder
          POSTGRES_TEST_PASSWORD: ci_placeholder
        run: ./mvnw -B -Ppostgres-integration verify

      - name: Verify PostgreSQL integration test report
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          expected = {
              "VisitorInteractionPostgresIT": 22,
              "DatabaseMigrationIT": 12,
              "SchemaDetectorIT": 16,
              "ArtifactQueryOptimizationIT": 5,
              "BeaconResolutionIntegrityIT": 17,
          }
          failed = False
          for class_name, minimum in expected.items():
              reports = glob.glob(
                  f"target/failsafe-reports/TEST-*{class_name}.xml"
              )
              if len(reports) != 1:
                  print(f"Expected one {class_name} report, found {len(reports)}")
                  failed = True
                  continue

              root = ET.parse(reports[0]).getroot()
              tests = int(root.attrib.get("tests", 0))
              failures = int(root.attrib.get("failures", 0))
              errors = int(root.attrib.get("errors", 0))
              skipped = int(root.attrib.get("skipped", 0))
              print(
                  f"{class_name}: tests={tests}, failures={failures}, "
                  f"errors={errors}, skipped={skipped}"
              )

              if tests < minimum or failures or errors or skipped:
                  print(f"{class_name} gate failed")
                  failed = True

          if failed:
              print("PostgreSQL integration test gate failed")
              sys.exit(1)
          PY

      - name: Upload PostgreSQL integration reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-integration-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          retention-days: 7
          if-no-files-found: ignore

  database-backup-restore:
    name: database-backup-restore
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smart_heritage_backup_ci
          POSTGRES_USER: backup_ci
          POSTGRES_PASSWORD: backup_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backup_ci -d smart_heritage_backup_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: backup_ci
      PGPASSWORD: backup_ci
      EXPECTED_POSTGRES_MAJOR: "16"
      TEST_DB_PREFIX: s6_backup_ci_
      FLYWAY_NETWORK: host
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build backend jar
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Run disposable backup/restore round trip
        env:
          BACKEND_JAR: backend/target/backend-0.0.1-SNAPSHOT.jar
          REQUIRE_APP_CHECK: "1"
        run: bash scripts/database/test-backup-restore.sh

  frontend-checks:
    name: frontend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run authentication regression tests
        run: npm test

      # `npm run build` runs `tsc -b && vite build`, which is the project's
      # TypeScript check and production build in one required step.
      - name: TypeScript and production build
        run: npm run build

  mobile-tests:
    name: mobile-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Existing lockfile has a Babel 7/8 peer-dependency conflict
      # (@babel/preset-env@8 vs babel-preset-expo using @babel/core@7).
      # --legacy-peer-deps keeps npm ci reproducible without altering app deps.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Jest tests
        run: npm test -- --ci --coverage

      - name: Upload Jest coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage
          path: mobile/coverage
          retention-days: 7
          if-no-files-found: ignore

  # Advisory only: pre-existing TypeScript/ESLint debt must stay visible without
  # blocking PRs yet. This job is NOT a required quality gate.
  mobile-static-analysis:
    name: mobile-static-analysis (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check (advisory)
        run: npx tsc --noEmit

      - name: ESLint (advisory)
        if: always()
        run: npm run lint

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate development Compose configuration
        env:
          POSTGRES_DB: smart_heritage_ci
          POSTGRES_USER: ci_placeholder
          POSTGRES_PASSWORD: ci_placeholder
          JWT_SECRET: ci_placeholder_secret_at_least_256_bits_long_000000
        run: docker compose config --quiet

      - name: Validate production Compose configuration
        env:
          POSTGRES_DB: smart_heritage_ci
          POSTGRES_USER: ci_placeholder
          POSTGRES_PASSWORD: ci_placeholder
          JWT_SECRET: ci_placeholder_secret_at_least_256_bits_long_000000
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:18080
        run: docker compose -f docker-compose.production.yml --env-file .env.production.example config --quiet

      - name: Build development Docker images
        run: docker compose build

  # Ephemeral public-only smoke test. It never receives credentials and does not
  # run write scenarios, so it is safe for CI data.
  integration-smoke:
    name: integration-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start ephemeral stack
        env:
          POSTGRES_DB: smart_heritage_ci
          POSTGRES_USER: ci_placeholder
          POSTGRES_PASSWORD: ci_placeholder
          JWT_SECRET: ci_placeholder_secret_at_least_256_bits_long_000000
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Run public smoke scenarios
        env:
          API_BASE_URL: http://localhost:8080/api
        run: python3 scripts/integration/smoke-test.py

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down ephemeral stack
        if: always()
        run: docker compose down -v --remove-orphans

  production-smoke:
    name: production-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_VERSION: ci
      APP_BIND_ADDRESS: 127.0.0.1
      APP_HTTP_PORT: "18080"
      POSTGRES_DB: smart_heritage_ci
      POSTGRES_USER: ci_placeholder
      POSTGRES_PASSWORD: ci_placeholder
      JWT_SECRET: ci_placeholder_secret_at_least_256_bits_long_000000
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:18080
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start production stack
        run: docker compose -f docker-compose.production.yml --env-file .env.production.example up -d --build --wait --wait-timeout 300

      - name: Verify frontend, proxy, and public API
        run: |
          set -euo pipefail
          test "$(curl -fsS http://127.0.0.1:18080/healthz)" = "ok"
          curl -fsS http://127.0.0.1:18080/api/health | grep -q '"status":"UP"'
          curl -fsS http://127.0.0.1:18080/ | grep -q '<div id="root"></div>'
          test "$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/dashboard)" = "200"
          curl -fsS http://127.0.0.1:18080/api/heritage-sites | grep -q '"success":true'

      - name: Verify backend and PostgreSQL ports are internal
        run: |
          set -euo pipefail
          docker compose -f docker-compose.production.yml --env-file .env.production.example config --format json > /tmp/production-compose.json
          python3 - <<'PY'
          import json

          with open('/tmp/production-compose.json') as f:
              services = json.load(f)['services']

          for name in ('backend', 'postgres'):
              ports = services[name].get('ports')
              if ports:
                  raise SystemExit(f'{name} publishes ports: {ports}')

          frontend_ports = services['frontend'].get('ports', [])
          if len(frontend_ports) != 1:
              raise SystemExit(f'frontend must publish exactly one port: {frontend_ports}')
          if frontend_ports[0].get('host_ip') != '127.0.0.1':
              raise SystemExit(f'frontend must bind loopback: {frontend_ports[0]}')

          print('Port exposure OK: backend/postgres internal, frontend loopback-only')
          PY

      - name: Show container logs on failure
        if: failure()
        run: docker compose -f docker-compose.production.yml --env-file .env.production.example logs --no-color

      - name: Tear down production smoke stack
        if: always()
        run: docker compose -f docker-compose.production.yml --env-file .env.production.example down -v --remove-orphans
