name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'LTJ-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        run: ./mvnw -B test

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore

  postgres-integration:
    name: postgres-integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smart_heritage_ci
          POSTGRES_USER: ci_placeholder
          POSTGRES_PASSWORD: ci_placeholder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_placeholder -d smart_heritage_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify Flyway migrations on real PostgreSQL
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/smart_heritage_ci
          SPRING_DATASOURCE_USERNAME: ci_placeholder
          SPRING_DATASOURCE_PASSWORD: ci_placeholder
        run: ./mvnw -B -Dtest=VisitorInteractionPostgresIntegrationTest test

      - name: Upload PostgreSQL surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-integration-surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore

  frontend-checks:
    name: frontend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run authentication regression tests
        run: npm test

      # `npm run build` runs `tsc -b && vite build`, which is the project's
      # TypeScript check and production build in one required step.
      - name: TypeScript and production build
        run: npm run build

  mobile-tests:
    name: mobile-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # Existing lockfile has a Babel 7/8 peer-dependency conflict
      # (@babel/preset-env@8 vs babel-preset-expo using @babel/core@7).
      # --legacy-peer-deps keeps npm ci reproducible without altering app deps.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Jest tests
        run: npm test -- --ci --coverage

      - name: Upload Jest coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage
          path: mobile/coverage
          retention-days: 7
          if-no-files-found: ignore

  # Advisory only: pre-existing TypeScript/ESLint debt must stay visible without
  # blocking PRs yet. This job is NOT a required quality gate.
  mobile-static-analysis:
    name: mobile-static-analysis (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check (advisory)
        run: npx tsc --noEmit

      - name: ESLint (advisory)
        if: always()
        run: npm run lint

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        env:
          POSTGRES_DB: smart_heritage_ci
          POSTGRES_USER: ci_placeholder
          POSTGRES_PASSWORD: ci_placeholder
          JWT_SECRET: ci_placeholder_secret_at_least_256_bits_long_000000
        run: docker compose config --quiet

      - name: Build Docker images
        run: docker compose build

  # Ephemeral public-only smoke test. It never receives credentials and does not
  # run write scenarios, so it is safe for CI data.
  integration-smoke:
    name: integration-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Start ephemeral stack
        env:
          POSTGRES_DB: smart_heritage_ci
          POSTGRES_USER: ci_placeholder
          POSTGRES_PASSWORD: ci_placeholder
          JWT_SECRET: ci_placeholder_secret_at_least_256_bits_long_000000
        run: docker compose up -d --build --wait --wait-timeout 240

      - name: Run public smoke scenarios
        env:
          API_BASE_URL: http://localhost:8080/api
        run: python3 scripts/integration/smoke-test.py

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down ephemeral stack
        if: always()
        run: docker compose down -v --remove-orphans
