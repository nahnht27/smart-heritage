spring:
  application:
    name: smart-heritage-backend

  # ===== PostgreSQL DataSource =====
  # Defaults work for local dev. Docker Compose overrides via environment variables.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_heritage}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # ===== Flyway database migrations =====
  # Fresh databases run V1..V4 in order. Existing databases without Flyway
  # history must be adopted explicitly after schema verification (default 3 is
  # the Hibernate-era schema; V4 then normalizes indexes/constraints):
  #   ./mvnw -B flyway:baseline -Dflyway.baselineVersion=<verified-version>
  # Automatic baselining is intentionally disabled because it can silently
  # accept an incomplete or unexpected schema. See docs/database/.
  flyway:
    enabled: true
    baseline-on-migrate: false
    baseline-version: 3
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

  # ===== JPA / Hibernate =====
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8080}

# ===== JWT Configuration =====
app:
  jwt:
    # Development-only fallback. Always override JWT_SECRET outside local dev
    # (Docker Compose / CI / production) with a strong secret of >= 256 bits.
    secret: ${JWT_SECRET:SmartHeritageDevSecretKeyThatIsAtLeast256BitsLong!2024}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  # ===== CORS Configuration =====
  # Default origins for local development. Override via CORS_ALLOWED_ORIGINS env var.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
