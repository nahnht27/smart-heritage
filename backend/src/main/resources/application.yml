spring:
  application:
    name: smart-heritage-backend

  # ===== PostgreSQL DataSource =====
  # Defaults work for local dev. Docker Compose overrides via environment variables.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smart_heritage}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # ===== JPA / Hibernate =====
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

# ===== JWT Configuration =====
app:
  jwt:
    secret: ${JWT_SECRET:SmartHeritageDevSecretKeyThatIsAtLeast256BitsLong!2024}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
